[workspace]
members = ["crates/core", "crates/platform", "crates/desktop"]
exclude = ["vendor/iced_winit", "vendor/iced_layershell"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Omni-Wild/task-focuser-rust"

[workspace.dependencies]
anyhow = "1.0.104"
iced = { version = "0.14", default-features = false, features = ["advanced", "canvas", "image-without-codecs", "tokio", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "net", "io-util"] }
tracing = "0.1.44"
tempfile = "3.27.0"
task-focuser-core = { version = "3.0.0", path = "crates/core" }
task-focuser-platform = { version = "3.0.0", path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
iced_layershell = { path = "vendor/iced_layershell" }
